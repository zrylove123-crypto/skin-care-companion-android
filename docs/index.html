<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#09080d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>宝宝工作辛苦了</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #09080d;
        --warm-white: #fff9f9;
        --muted: rgba(255, 235, 237, 0.48);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--ink);
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 41%, transparent 28%, rgba(0, 0, 0, 0.18) 72%, rgba(0, 0, 0, 0.55) 125%),
          linear-gradient(180deg, rgba(6, 5, 10, 0.12), transparent 22%, transparent 78%, rgba(6, 5, 10, 0.34));
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .hint {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.18em;
        white-space: nowrap;
        opacity: 0;
        animation: hint-in 1.1s ease 8.4s forwards;
        pointer-events: none;
      }

      .fullscreen {
        position: fixed;
        right: 18px;
        top: calc(16px + env(safe-area-inset-top));
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 230, 233, 0.12);
        border-radius: 50%;
        color: rgba(255, 240, 242, 0.6);
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .fullscreen:active {
        transform: scale(0.94);
        background: rgba(255, 255, 255, 0.08);
      }

      .fullscreen svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @keyframes hint-in {
        to { opacity: 1; }
      }

    </style>
  </head>
  <body aria-label="淡粉与暖白色粒子从四周汇聚成完整爱心，文字为宝宝工作辛苦了">
    <canvas id="heartCanvas" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <p class="sr-only">宝宝工作辛苦了</p>
    <p class="hint">轻触屏幕 · 再看一次</p>
    <button class="fullscreen" id="fullscreen" type="button" aria-label="全屏播放">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
      </svg>
    </button>

    <script>
      (() => {
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d", { alpha: false });
        const fullscreen = document.getElementById("fullscreen");
        const TAU = Math.PI * 2;
        const CYCLE = 10500;
        const FORM_END = 4050;
        const HOLD_END = 6650;
        const SCATTER_END = 9750;
        const palette = [
          [255, 252, 251],
          [255, 239, 240],
          [250, 215, 220],
          [236, 187, 197],
          [218, 158, 173],
          [255, 225, 229]
        ];

        let width = 0;
        let height = 0;
        let dpr = 1;
        let centerX = 0;
        let centerY = 0;
        let heartScale = 1;
        let heartPath = null;
        let textCanvas = null;
        let textLeft = 0;
        let textTop = 0;
        let textCenterY = 0;
        let particles = [];
        let stars = [];
        let startedAt = performance.now();
        let lastCycle = -1;
        let raf = 0;

        const clamp = (n, a = 0, b = 1) => Math.max(a, Math.min(b, n));
        const mix = (a, b, t) => a + (b - a) * t;
        const smooth = t => t * t * (3 - 2 * t);
        const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
        const easeInQuart = t => t * t * t * t;
        const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;

        function heartEquation(x, y) {
          const q = x * x + y * y - 1;
          return q * q * q - x * x * y * y * y;
        }

        function sampleHeart(edgeOnly) {
          let fallback = { x: 0, y: 0 };
          for (let attempt = 0; attempt < 260; attempt++) {
            const x = Math.random() * 2.34 - 1.17;
            const y = Math.random() * 2.28 - 1.08;
            const value = heartEquation(x, y);
            if (value <= 0) {
              fallback = { x, y };
              if (!edgeOnly || value > -0.045) return fallback;
            }
          }
          return fallback;
        }

        function makeHeartPath() {
          const path = new Path2D();
          for (let i = 0; i <= 360; i++) {
            const t = i / 360 * TAU;
            const x = Math.pow(Math.sin(t), 3);
            const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17 + 0.12;
            const px = centerX + x * heartScale;
            const py = centerY - y * heartScale;
            if (i === 0) path.moveTo(px, py);
            else path.lineTo(px, py);
          }
          path.closePath();
          return path;
        }

        function targetPoint(edgeOnly) {
          const point = sampleHeart(edgeOnly);
          return {
            x: centerX + point.x * heartScale,
            y: centerY - point.y * heartScale * 0.98
          };
        }

        function makeStart(target) {
          const angle = Math.random() * TAU;
          const diagonal = Math.hypot(width, height);
          const radius = diagonal * (0.48 + Math.random() * 0.42);
          const spread = Math.min(width, height) * 0.18;
          return {
            x: centerX + Math.cos(angle) * radius + (Math.random() - 0.5) * spread,
            y: centerY + Math.sin(angle) * radius + (Math.random() - 0.5) * spread,
            angle,
            distance: Math.hypot(target.x - centerX, target.y - centerY)
          };
        }

        function buildTextTargets() {
          const offscreen = document.createElement("canvas");
          const offCtx = offscreen.getContext("2d", { willReadFrequently: true });
          const chars = Array.from("宝宝工作辛苦了");
          const fontSize = clamp(width * 0.068, 24, 32);
          const spacing = fontSize * 0.13;
          const font = `700 ${fontSize}px "PingFang SC", "Microsoft YaHei", sans-serif`;
          offCtx.font = font;
          const widths = chars.map(char => offCtx.measureText(char).width);
          const contentWidth = widths.reduce((sum, value) => sum + value, 0) + spacing * (chars.length - 1);
          const padding = 22;
          offscreen.width = Math.ceil(contentWidth + padding * 2);
          offscreen.height = Math.ceil(fontSize * 2.05 + padding);

          offCtx.clearRect(0, 0, offscreen.width, offscreen.height);
          offCtx.font = font;
          offCtx.fillStyle = "#fff";
          offCtx.textAlign = "left";
          offCtx.textBaseline = "middle";
          let cursor = padding;
          for (let index = 0; index < chars.length; index++) {
            offCtx.fillText(chars[index], cursor, offscreen.height * 0.5);
            cursor += widths[index] + spacing;
          }

          const image = offCtx.getImageData(0, 0, offscreen.width, offscreen.height).data;
          const candidates = [];
          const step = width < 360 ? 2 : 2;
          for (let y = 0; y < offscreen.height; y += step) {
            for (let x = 0; x < offscreen.width; x += step) {
              if (image[(y * offscreen.width + x) * 4 + 3] > 72) {
                candidates.push({ x, y, flow: x / offscreen.width });
              }
            }
          }

          for (let index = candidates.length - 1; index > 0; index--) {
            const swapIndex = Math.floor(Math.random() * (index + 1));
            [candidates[index], candidates[swapIndex]] = [candidates[swapIndex], candidates[index]];
          }

          const maxCount = Math.round(clamp(width * 2.35, 720, 1050));
          textCanvas = offscreen;
          textLeft = centerX - offscreen.width * 0.5;
          textCenterY = height * (width > height ? 0.79 : 0.72);
          textTop = textCenterY - offscreen.height * 0.5;

          return candidates.slice(0, maxCount).map(point => ({
            x: textLeft + point.x,
            y: textTop + point.y,
            flow: point.flow
          }));
        }

        function buildScene() {
          const area = width * height;
          const count = Math.round(clamp(area / 145, 1950, 3350));

          const heartParticles = Array.from({ length: count }, (_, index) => {
            const edgeOnly = index < count * 0.27;
            const target = targetPoint(edgeOnly);
            const start = makeStart(target);
            const dx = target.x - start.x;
            const dy = target.y - start.y;
            const distance = Math.max(1, Math.hypot(dx, dy));
            const direction = Math.random() < 0.5 ? -1 : 1;
            const curveStrength = (0.07 + Math.random() * 0.2) * distance * direction;
            const windLeft = Math.random() < 0.09;
            const rgb = palette[Math.floor(Math.random() * palette.length)];
            return {
              sx: start.x,
              sy: start.y,
              tx: target.x,
              ty: target.y,
              delay: Math.random() * 820 + (index % 17) * 11,
              duration: 2350 + Math.random() * 600,
              curveX: -dy / distance * curveStrength,
              curveY: dx / distance * curveStrength,
              windX: (windLeft ? -1 : 1) * width * (0.56 + Math.random() * 1.22),
              windY: height * (Math.random() - 0.57) * 0.62,
              flutter: 8 + Math.random() * 34,
              phase: Math.random() * TAU,
              size: edgeOnly ? 0.68 + Math.random() * 1.28 : 0.42 + Math.random() * 1.18,
              alpha: edgeOnly ? 0.66 + Math.random() * 0.34 : 0.42 + Math.random() * 0.5,
              twinkle: 0.5 + Math.random() * 1.5,
              trail: Math.random() < 0.48,
              glow: Math.random() < 0.24,
              isText: false,
              flow: 0,
              rgb
            };
          });

          const textTargets = buildTextTargets();
          const textParticles = textTargets.map((target, index) => {
            const start = makeStart(target);
            const dx = target.x - start.x;
            const dy = target.y - start.y;
            const distance = Math.max(1, Math.hypot(dx, dy));
            const direction = Math.random() < 0.5 ? -1 : 1;
            const curveStrength = (0.08 + Math.random() * 0.22) * distance * direction;
            const rgb = Math.random() < 0.42 ? palette[0] : palette[Math.random() < 0.55 ? 1 : 2];
            return {
              sx: start.x,
              sy: start.y,
              tx: target.x,
              ty: target.y,
              delay: Math.random() * 820 + (index % 17) * 11,
              duration: 2350 + Math.random() * 600,
              curveX: -dy / distance * curveStrength,
              curveY: dx / distance * curveStrength,
              windX: (Math.random() < 0.5 ? -1 : 1) * width * (0.64 + Math.random() * 1.14),
              windY: height * (Math.random() - 0.54) * 0.58,
              flutter: 8 + Math.random() * 28,
              phase: Math.random() * TAU,
              size: 0.48 + Math.random() * 0.86,
              alpha: 0.7 + Math.random() * 0.3,
              twinkle: 0.72 + Math.random() * 1.25,
              trail: Math.random() < 0.5,
              glow: Math.random() < 0.3,
              isText: true,
              flow: target.flow,
              rgb
            };
          });

          particles = heartParticles.concat(textParticles);

          stars = Array.from({ length: Math.round(clamp(area / 8600, 42, 92)) }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            r: 0.2 + Math.random() * 0.75,
            a: 0.035 + Math.random() * 0.13,
            phase: Math.random() * TAU
          }));
        }

        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          dpr = Math.min(window.devicePixelRatio || 1, 1.65);
          centerX = width * 0.5;
          centerY = height * 0.415;
          heartScale = Math.min(width * 0.35, height * 0.255);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = width + "px";
          canvas.style.height = height + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          heartPath = makeHeartPath();
          buildScene();
          startedAt = performance.now();
          lastCycle = -1;
        }

        function drawBackground(now, time) {
          ctx.fillStyle = "#09080d";
          ctx.fillRect(0, 0, width, height);

          const strength = time < HOLD_END
            ? smooth(clamp((time - 1600) / 2600))
            : 1 - smooth(clamp((time - HOLD_END) / 2500));
          const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height) * 0.54);
          glow.addColorStop(0, `rgba(103, 54, 70, ${0.08 + strength * 0.18})`);
          glow.addColorStop(0.42, `rgba(45, 28, 37, ${0.04 + strength * 0.07})`);
          glow.addColorStop(1, "rgba(9, 8, 13, 0)");
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, width, height);

          for (const star of stars) {
            const twinkle = 0.62 + Math.sin(now * 0.0012 + star.phase) * 0.38;
            ctx.fillStyle = `rgba(255, 228, 232, ${star.a * twinkle})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.r, 0, TAU);
            ctx.fill();
          }
        }

        function stateAt(particle, time) {
          if (time < FORM_END) {
            const raw = clamp((time - particle.delay) / particle.duration);
            const e = easeOutQuart(raw);
            const arc = Math.sin(Math.PI * raw) * (1 - raw * 0.3);
            return {
              x: mix(particle.sx, particle.tx, e) + particle.curveX * arc,
              y: mix(particle.sy, particle.ty, e) + particle.curveY * arc,
              alpha: particle.alpha * clamp(raw * 1.8),
              size: particle.size * (0.66 + raw * 0.34)
            };
          }

          if (time < HOLD_END) {
            const hold = (time - FORM_END) / (HOLD_END - FORM_END);
            const breathe = Math.sin(hold * Math.PI * 3.4) * 0.021;
            const shimmer = 0.84 + Math.sin(hold * 19 * particle.twinkle + particle.phase) * 0.16;
            const originY = particle.isText ? textCenterY : centerY;
            return {
              x: centerX + (particle.tx - centerX) * (1 + breathe) + Math.sin(hold * 11 + particle.phase) * 0.48,
              y: originY + (particle.ty - originY) * (1 + breathe) + Math.cos(hold * 9 + particle.phase) * 0.48,
              alpha: particle.alpha * shimmer,
              size: particle.size * (1 + breathe * 4.2)
            };
          }

          const raw = clamp((time - HOLD_END) / (SCATTER_END - HOLD_END));
          const e = easeInQuart(raw);
          return {
            x: particle.tx + particle.windX * e + Math.sin(raw * 13 + particle.phase) * particle.flutter * raw,
            y: particle.ty + particle.windY * e + Math.cos(raw * 8 + particle.phase) * particle.flutter * 0.46 * raw,
            alpha: particle.alpha * Math.pow(1 - raw, 1.2),
            size: particle.size * (1 + raw * 0.46)
          };
        }

        function drawHeartAura(time) {
          const formed = smooth(clamp((time - 3000) / 1000));
          const remaining = 1 - smooth(clamp((time - HOLD_END) / 1500));
          const alpha = formed * remaining;
          if (alpha <= 0.002) return;

          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.shadowColor = `rgba(239, 157, 177, ${0.42 * alpha})`;
          ctx.shadowBlur = 38;
          ctx.fillStyle = `rgba(232, 158, 176, ${0.055 * alpha})`;
          ctx.fill(heartPath);
          ctx.lineWidth = 1.1;
          ctx.strokeStyle = `rgba(255, 224, 230, ${0.18 * alpha})`;
          ctx.stroke(heartPath);
          ctx.restore();
        }

        function drawTextAura(time) {
          if (!textCanvas) return;
          const formed = smooth(clamp((time - 3000) / 1000));
          const remaining = 1 - smooth(clamp((time - HOLD_END) / 1350));
          const alpha = formed * remaining;
          if (alpha <= 0.002) return;

          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.globalAlpha = 0.035 * alpha;
          ctx.shadowColor = `rgba(246, 180, 194, ${0.48 * alpha})`;
          ctx.shadowBlur = 20;
          ctx.drawImage(textCanvas, textLeft, textTop);
          ctx.restore();
        }

        function drawImpact(time) {
          const delta = time - 3850;
          if (delta < -700 || delta > 1300) return;
          const impact = Math.exp(-Math.pow(delta / 420, 2));
          const radius = heartScale * (0.35 + clamp((delta + 180) / 1000) * 1.1);
          const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(8, radius));
          glow.addColorStop(0, `rgba(255, 250, 249, ${0.2 * impact})`);
          glow.addColorStop(0.28, `rgba(255, 213, 221, ${0.14 * impact})`);
          glow.addColorStop(1, "rgba(229, 142, 165, 0)");
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = glow;
          ctx.fillRect(centerX - radius, centerY - radius, radius * 2, radius * 2);

          const wave = clamp((delta + 80) / 920);
          if (wave > 0 && wave < 1) {
            ctx.translate(centerX, centerY);
            const expansion = 1 + wave * 0.17;
            ctx.scale(expansion, expansion);
            ctx.translate(-centerX, -centerY);
            ctx.lineWidth = 1.7 - wave;
            ctx.shadowColor = "rgba(255, 190, 204, 0.5)";
            ctx.shadowBlur = 16;
            ctx.strokeStyle = `rgba(255, 225, 231, ${0.42 * (1 - wave)})`;
            ctx.stroke(heartPath);
          }
          ctx.restore();
        }

        function drawParticles(time) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.lineCap = "round";

          for (const particle of particles) {
            const state = stateAt(particle, time);
            if (state.alpha < 0.006 || state.x < -150 || state.x > width + 150 || state.y < -150 || state.y > height + 150) continue;
            const [r, g, b] = particle.rgb;

            if (particle.trail && (time < FORM_END || time > HOLD_END)) {
              const previous = stateAt(particle, Math.max(0, time - 54));
              const velocity = Math.hypot(state.x - previous.x, state.y - previous.y);
              if (velocity > 1.2) {
                ctx.lineWidth = Math.max(0.45, state.size * 0.78);
                ctx.strokeStyle = `rgba(${r},${g},${b},${state.alpha * 0.38})`;
                ctx.beginPath();
                ctx.moveTo(previous.x, previous.y);
                ctx.lineTo(state.x, state.y);
                ctx.stroke();
              }
            }

            let displayAlpha = state.alpha;
            let radius = Math.max(0.34, state.size);
            if (particle.isText && time >= FORM_END && time < HOLD_END) {
              const hold = (time - FORM_END) / (HOLD_END - FORM_END);
              const sweep = (hold * 1.72) % 1.36 - 0.18;
              const distanceFromSweep = particle.flow - sweep;
              const band = Math.exp(-(distanceFromSweep * distanceFromSweep) / 0.0095);
              displayAlpha = Math.min(1, state.alpha * (0.78 + band * 0.72));
              radius *= 1 + band * 0.82;
            }
            if (particle.glow || radius > 1.25) {
              ctx.fillStyle = `rgba(${r},${g},${b},${displayAlpha * 0.12})`;
              ctx.beginPath();
              ctx.arc(state.x, state.y, radius * 4.2, 0, TAU);
              ctx.fill();
            }

            ctx.fillStyle = `rgba(${r},${g},${b},${displayAlpha})`;
            ctx.beginPath();
            ctx.arc(state.x, state.y, radius, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        function render(now) {
          const elapsed = now - startedAt;
          const cycle = Math.floor(elapsed / CYCLE);
          const time = elapsed % CYCLE;
          if (cycle !== lastCycle) {
            if (lastCycle >= 0) buildScene();
            lastCycle = cycle;
          }

          drawBackground(now, time);
          drawHeartAura(time);
          drawTextAura(time);
          drawImpact(time);
          drawParticles(time);
          raf = requestAnimationFrame(render);
        }

        function restart(event) {
          if (event && (event.target === fullscreen || fullscreen.contains(event.target))) return;
          buildScene();
          startedAt = performance.now();
          lastCycle = -1;
        }

        fullscreen.addEventListener("click", async event => {
          event.stopPropagation();
          try {
            if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
            else await document.exitFullscreen();
          } catch (_) {
            restart();
          }
        });

        document.addEventListener("pointerup", restart, { passive: true });
        window.addEventListener("resize", resize, { passive: true });
        window.addEventListener("orientationchange", () => setTimeout(resize, 120), { passive: true });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) cancelAnimationFrame(raf);
          else {
            startedAt = performance.now();
            lastCycle = -1;
            raf = requestAnimationFrame(render);
          }
        });

        resize();
        raf = requestAnimationFrame(render);
      })();
    </script>
  </body>
</html>
