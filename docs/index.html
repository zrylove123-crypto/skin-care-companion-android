<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#09080d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>宝宝工作辛苦了</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #09080d;
        --warm-white: #fff9f9;
        --muted: rgba(255, 235, 237, 0.48);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--ink);
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 41%, transparent 28%, rgba(0, 0, 0, 0.18) 72%, rgba(0, 0, 0, 0.55) 125%),
          linear-gradient(180deg, rgba(6, 5, 10, 0.12), transparent 22%, transparent 78%, rgba(6, 5, 10, 0.34));
      }

      .message {
        position: fixed;
        top: 70.5%;
        left: 50%;
        width: min(88vw, 440px);
        margin: 0;
        transform: translate(-50%, 16px) scale(0.985);
        color: var(--warm-white);
        text-align: center;
        font-size: clamp(22px, 6.1vw, 30px);
        font-weight: 450;
        letter-spacing: 0.16em;
        line-height: 1.4;
        opacity: 0;
        text-shadow:
          0 0 10px rgba(255, 250, 250, 0.32),
          0 0 28px rgba(239, 165, 178, 0.38);
        pointer-events: none;
        will-change: opacity, transform;
        --shine-x: -35%;
        --flare-opacity: 0;
      }

      .message .char {
        display: inline-block;
        color: transparent;
        background:
          linear-gradient(108deg,
            #ecc2c9 0%,
            #fffafa 33%,
            #ffffff 48%,
            #f2c5ce 72%,
            #dca6b3 100%);
        background-size: 220% 100%;
        background-position: var(--shine-x) center;
        -webkit-background-clip: text;
        background-clip: text;
        opacity: 0;
        filter: drop-shadow(0 0 6px rgba(255, 230, 234, 0.46));
        transform: translateY(10px) scale(0.88);
        will-change: opacity, transform, background-position;
      }

      .message::before {
        content: "";
        position: absolute;
        z-index: -1;
        top: 50%;
        left: var(--shine-x);
        width: 58px;
        height: 34px;
        transform: translate(-50%, -50%) skewX(-18deg);
        border-radius: 50%;
        background: rgba(255, 236, 239, 0.3);
        filter: blur(15px);
        opacity: var(--flare-opacity);
      }

      .message::after {
        content: "";
        display: block;
        width: 42px;
        height: 1px;
        margin: 17px auto 0;
        background: linear-gradient(90deg, transparent, rgba(255, 226, 229, 0.72), transparent);
        box-shadow: 0 0 10px rgba(255, 201, 208, 0.36);
      }

      .hint {
        position: fixed;
        left: 50%;
        bottom: calc(24px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.18em;
        white-space: nowrap;
        opacity: 0;
        animation: hint-in 1.1s ease 8.4s forwards;
        pointer-events: none;
      }

      .fullscreen {
        position: fixed;
        right: 18px;
        top: calc(16px + env(safe-area-inset-top));
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(255, 230, 233, 0.12);
        border-radius: 50%;
        color: rgba(255, 240, 242, 0.6);
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .fullscreen:active {
        transform: scale(0.94);
        background: rgba(255, 255, 255, 0.08);
      }

      .fullscreen svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      @keyframes hint-in {
        to { opacity: 1; }
      }

      @media (orientation: landscape) {
        .message {
          top: 78%;
          font-size: clamp(18px, 3.2vw, 28px);
        }
      }
    </style>
  </head>
  <body aria-label="淡粉与暖白色粒子从四周汇聚成完整爱心，文字为宝宝工作辛苦了">
    <canvas id="heartCanvas" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <p class="message" id="message" aria-label="宝宝工作辛苦了">
      <span class="char">宝</span><span class="char">宝</span><span class="char">工</span><span class="char">作</span><span class="char">辛</span><span class="char">苦</span><span class="char">了</span>
    </p>
    <p class="hint">轻触屏幕 · 再看一次</p>
    <button class="fullscreen" id="fullscreen" type="button" aria-label="全屏播放">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5" />
      </svg>
    </button>

    <script>
      (() => {
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d", { alpha: false });
        const message = document.getElementById("message");
        const messageChars = Array.from(message.querySelectorAll(".char"));
        const fullscreen = document.getElementById("fullscreen");
        const TAU = Math.PI * 2;
        const CYCLE = 10500;
        const FORM_END = 4050;
        const HOLD_END = 6650;
        const SCATTER_END = 9750;
        const palette = [
          [255, 252, 251],
          [255, 239, 240],
          [250, 215, 220],
          [236, 187, 197],
          [218, 158, 173],
          [255, 225, 229]
        ];

        let width = 0;
        let height = 0;
        let dpr = 1;
        let centerX = 0;
        let centerY = 0;
        let heartScale = 1;
        let heartPath = null;
        let particles = [];
        let stars = [];
        let startedAt = performance.now();
        let lastCycle = -1;
        let raf = 0;

        const clamp = (n, a = 0, b = 1) => Math.max(a, Math.min(b, n));
        const mix = (a, b, t) => a + (b - a) * t;
        const smooth = t => t * t * (3 - 2 * t);
        const easeOutQuart = t => 1 - Math.pow(1 - t, 4);
        const easeInQuart = t => t * t * t * t;
        const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;

        function heartEquation(x, y) {
          const q = x * x + y * y - 1;
          return q * q * q - x * x * y * y * y;
        }

        function sampleHeart(edgeOnly) {
          let fallback = { x: 0, y: 0 };
          for (let attempt = 0; attempt < 260; attempt++) {
            const x = Math.random() * 2.34 - 1.17;
            const y = Math.random() * 2.28 - 1.08;
            const value = heartEquation(x, y);
            if (value <= 0) {
              fallback = { x, y };
              if (!edgeOnly || value > -0.045) return fallback;
            }
          }
          return fallback;
        }

        function makeHeartPath() {
          const path = new Path2D();
          for (let i = 0; i <= 360; i++) {
            const t = i / 360 * TAU;
            const x = Math.pow(Math.sin(t), 3);
            const y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17 + 0.12;
            const px = centerX + x * heartScale;
            const py = centerY - y * heartScale;
            if (i === 0) path.moveTo(px, py);
            else path.lineTo(px, py);
          }
          path.closePath();
          return path;
        }

        function targetPoint(edgeOnly) {
          const point = sampleHeart(edgeOnly);
          return {
            x: centerX + point.x * heartScale,
            y: centerY - point.y * heartScale * 0.98
          };
        }

        function makeStart(target) {
          const angle = Math.random() * TAU;
          const diagonal = Math.hypot(width, height);
          const radius = diagonal * (0.48 + Math.random() * 0.42);
          const spread = Math.min(width, height) * 0.18;
          return {
            x: centerX + Math.cos(angle) * radius + (Math.random() - 0.5) * spread,
            y: centerY + Math.sin(angle) * radius + (Math.random() - 0.5) * spread,
            angle,
            distance: Math.hypot(target.x - centerX, target.y - centerY)
          };
        }

        function buildScene() {
          const area = width * height;
          const count = Math.round(clamp(area / 145, 1950, 3350));

          particles = Array.from({ length: count }, (_, index) => {
            const edgeOnly = index < count * 0.27;
            const target = targetPoint(edgeOnly);
            const start = makeStart(target);
            const dx = target.x - start.x;
            const dy = target.y - start.y;
            const distance = Math.max(1, Math.hypot(dx, dy));
            const direction = Math.random() < 0.5 ? -1 : 1;
            const curveStrength = (0.07 + Math.random() * 0.2) * distance * direction;
            const windLeft = Math.random() < 0.09;
            const rgb = palette[Math.floor(Math.random() * palette.length)];
            return {
              sx: start.x,
              sy: start.y,
              tx: target.x,
              ty: target.y,
              delay: Math.random() * 820 + (index % 17) * 11,
              duration: 2350 + Math.random() * 600,
              curveX: -dy / distance * curveStrength,
              curveY: dx / distance * curveStrength,
              windX: (windLeft ? -1 : 1) * width * (0.56 + Math.random() * 1.22),
              windY: height * (Math.random() - 0.57) * 0.62,
              flutter: 8 + Math.random() * 34,
              phase: Math.random() * TAU,
              size: edgeOnly ? 0.68 + Math.random() * 1.28 : 0.42 + Math.random() * 1.18,
              alpha: edgeOnly ? 0.66 + Math.random() * 0.34 : 0.42 + Math.random() * 0.5,
              twinkle: 0.5 + Math.random() * 1.5,
              trail: Math.random() < 0.48,
              glow: Math.random() < 0.24,
              rgb
            };
          });

          stars = Array.from({ length: Math.round(clamp(area / 8600, 42, 92)) }, () => ({
            x: Math.random() * width,
            y: Math.random() * height,
            r: 0.2 + Math.random() * 0.75,
            a: 0.035 + Math.random() * 0.13,
            phase: Math.random() * TAU
          }));
        }

        function resize() {
          width = window.innerWidth;
          height = window.innerHeight;
          dpr = Math.min(window.devicePixelRatio || 1, 1.65);
          centerX = width * 0.5;
          centerY = height * 0.415;
          heartScale = Math.min(width * 0.35, height * 0.255);
          canvas.width = Math.round(width * dpr);
          canvas.height = Math.round(height * dpr);
          canvas.style.width = width + "px";
          canvas.style.height = height + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          heartPath = makeHeartPath();
          buildScene();
          startedAt = performance.now();
          lastCycle = -1;
        }

        function drawBackground(now, time) {
          ctx.fillStyle = "#09080d";
          ctx.fillRect(0, 0, width, height);

          const strength = time < HOLD_END
            ? smooth(clamp((time - 1600) / 2600))
            : 1 - smooth(clamp((time - HOLD_END) / 2500));
          const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height) * 0.54);
          glow.addColorStop(0, `rgba(103, 54, 70, ${0.08 + strength * 0.18})`);
          glow.addColorStop(0.42, `rgba(45, 28, 37, ${0.04 + strength * 0.07})`);
          glow.addColorStop(1, "rgba(9, 8, 13, 0)");
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, width, height);

          for (const star of stars) {
            const twinkle = 0.62 + Math.sin(now * 0.0012 + star.phase) * 0.38;
            ctx.fillStyle = `rgba(255, 228, 232, ${star.a * twinkle})`;
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.r, 0, TAU);
            ctx.fill();
          }
        }

        function stateAt(particle, time) {
          if (time < FORM_END) {
            const raw = clamp((time - particle.delay) / particle.duration);
            const e = easeOutQuart(raw);
            const arc = Math.sin(Math.PI * raw) * (1 - raw * 0.3);
            return {
              x: mix(particle.sx, particle.tx, e) + particle.curveX * arc,
              y: mix(particle.sy, particle.ty, e) + particle.curveY * arc,
              alpha: particle.alpha * clamp(raw * 1.8),
              size: particle.size * (0.66 + raw * 0.34)
            };
          }

          if (time < HOLD_END) {
            const hold = (time - FORM_END) / (HOLD_END - FORM_END);
            const breathe = Math.sin(hold * Math.PI * 3.4) * 0.021;
            const shimmer = 0.84 + Math.sin(hold * 19 * particle.twinkle + particle.phase) * 0.16;
            return {
              x: centerX + (particle.tx - centerX) * (1 + breathe) + Math.sin(hold * 11 + particle.phase) * 0.48,
              y: centerY + (particle.ty - centerY) * (1 + breathe) + Math.cos(hold * 9 + particle.phase) * 0.48,
              alpha: particle.alpha * shimmer,
              size: particle.size * (1 + breathe * 4.2)
            };
          }

          const raw = clamp((time - HOLD_END) / (SCATTER_END - HOLD_END));
          const e = easeInQuart(raw);
          return {
            x: particle.tx + particle.windX * e + Math.sin(raw * 13 + particle.phase) * particle.flutter * raw,
            y: particle.ty + particle.windY * e + Math.cos(raw * 8 + particle.phase) * particle.flutter * 0.46 * raw,
            alpha: particle.alpha * Math.pow(1 - raw, 1.2),
            size: particle.size * (1 + raw * 0.46)
          };
        }

        function drawHeartAura(time) {
          const formed = smooth(clamp((time - 3000) / 1000));
          const remaining = 1 - smooth(clamp((time - HOLD_END) / 1500));
          const alpha = formed * remaining;
          if (alpha <= 0.002) return;

          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.shadowColor = `rgba(239, 157, 177, ${0.42 * alpha})`;
          ctx.shadowBlur = 38;
          ctx.fillStyle = `rgba(232, 158, 176, ${0.055 * alpha})`;
          ctx.fill(heartPath);
          ctx.lineWidth = 1.1;
          ctx.strokeStyle = `rgba(255, 224, 230, ${0.18 * alpha})`;
          ctx.stroke(heartPath);
          ctx.restore();
        }

        function drawImpact(time) {
          const delta = time - 3850;
          if (delta < -700 || delta > 1300) return;
          const impact = Math.exp(-Math.pow(delta / 420, 2));
          const radius = heartScale * (0.35 + clamp((delta + 180) / 1000) * 1.1);
          const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(8, radius));
          glow.addColorStop(0, `rgba(255, 250, 249, ${0.2 * impact})`);
          glow.addColorStop(0.28, `rgba(255, 213, 221, ${0.14 * impact})`);
          glow.addColorStop(1, "rgba(229, 142, 165, 0)");
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = glow;
          ctx.fillRect(centerX - radius, centerY - radius, radius * 2, radius * 2);

          const wave = clamp((delta + 80) / 920);
          if (wave > 0 && wave < 1) {
            ctx.translate(centerX, centerY);
            const expansion = 1 + wave * 0.17;
            ctx.scale(expansion, expansion);
            ctx.translate(-centerX, -centerY);
            ctx.lineWidth = 1.7 - wave;
            ctx.shadowColor = "rgba(255, 190, 204, 0.5)";
            ctx.shadowBlur = 16;
            ctx.strokeStyle = `rgba(255, 225, 231, ${0.42 * (1 - wave)})`;
            ctx.stroke(heartPath);
          }
          ctx.restore();
        }

        function drawParticles(time) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.lineCap = "round";

          for (const particle of particles) {
            const state = stateAt(particle, time);
            if (state.alpha < 0.006 || state.x < -150 || state.x > width + 150 || state.y < -150 || state.y > height + 150) continue;
            const [r, g, b] = particle.rgb;

            if (particle.trail && (time < FORM_END || time > HOLD_END)) {
              const previous = stateAt(particle, Math.max(0, time - 54));
              const velocity = Math.hypot(state.x - previous.x, state.y - previous.y);
              if (velocity > 1.2) {
                ctx.lineWidth = Math.max(0.45, state.size * 0.78);
                ctx.strokeStyle = `rgba(${r},${g},${b},${state.alpha * 0.38})`;
                ctx.beginPath();
                ctx.moveTo(previous.x, previous.y);
                ctx.lineTo(state.x, state.y);
                ctx.stroke();
              }
            }

            const radius = Math.max(0.34, state.size);
            if (particle.glow || radius > 1.25) {
              ctx.fillStyle = `rgba(${r},${g},${b},${state.alpha * 0.12})`;
              ctx.beginPath();
              ctx.arc(state.x, state.y, radius * 4.2, 0, TAU);
              ctx.fill();
            }

            ctx.fillStyle = `rgba(${r},${g},${b},${state.alpha})`;
            ctx.beginPath();
            ctx.arc(state.x, state.y, radius, 0, TAU);
            ctx.fill();
          }
          ctx.restore();
        }

        function updateMessage(time) {
          let opacity = 0;
          let lift = 16;
          let scale = 0.985;
          if (time >= 4200 && time < 5050) {
            const e = easeInOutSine((time - 4200) / 850);
            opacity = e;
            lift = mix(16, 0, e);
            scale = mix(0.985, 1, e);
          } else if (time >= 5050 && time < 6650) {
            opacity = 1;
            lift = 0;
            scale = 1;
          } else if (time >= 6650 && time < 7900) {
            const e = clamp((time - 6650) / 1250);
            opacity = 1 - e;
            lift = -9 * e;
            scale = 1 + e * 0.012;
          }
          message.style.opacity = opacity.toFixed(3);
          message.style.transform = `translate(-50%, ${lift.toFixed(1)}px) scale(${scale.toFixed(3)})`;
          const sweep = clamp((time - 4350) / 1850);
          message.style.setProperty("--shine-x", `${mix(-28, 128, sweep).toFixed(1)}%`);
          message.style.setProperty("--flare-opacity", String(opacity * Math.sin(Math.PI * sweep) * 0.82));
          for (let index = 0; index < messageChars.length; index++) {
            const reveal = smooth(clamp((time - 4170 - index * 92) / 520));
            const vanish = 1 - smooth(clamp((time - 6650 - index * 42) / 850));
            const charOpacity = reveal * vanish;
            const char = messageChars[index];
            char.style.opacity = charOpacity.toFixed(3);
            char.style.transform = `translateY(${mix(10, 0, reveal).toFixed(1)}px) scale(${mix(0.88, 1, reveal).toFixed(3)})`;
          }
        }

        function render(now) {
          const elapsed = now - startedAt;
          const cycle = Math.floor(elapsed / CYCLE);
          const time = elapsed % CYCLE;
          if (cycle !== lastCycle) {
            if (lastCycle >= 0) buildScene();
            lastCycle = cycle;
          }

          drawBackground(now, time);
          drawHeartAura(time);
          drawImpact(time);
          drawParticles(time);
          updateMessage(time);
          raf = requestAnimationFrame(render);
        }

        function restart(event) {
          if (event && (event.target === fullscreen || fullscreen.contains(event.target))) return;
          buildScene();
          startedAt = performance.now();
          lastCycle = -1;
        }

        fullscreen.addEventListener("click", async event => {
          event.stopPropagation();
          try {
            if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
            else await document.exitFullscreen();
          } catch (_) {
            restart();
          }
        });

        document.addEventListener("pointerup", restart, { passive: true });
        window.addEventListener("resize", resize, { passive: true });
        window.addEventListener("orientationchange", () => setTimeout(resize, 120), { passive: true });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) cancelAnimationFrame(raf);
          else {
            startedAt = performance.now();
            lastCycle = -1;
            raf = requestAnimationFrame(render);
          }
        });

        resize();
        raf = requestAnimationFrame(render);
      })();
    </script>
  </body>
</html>
